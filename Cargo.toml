[workspace]
resolver = "3"
members = ["crates/typr-core", "crates/typr"]

# Native Shell, at the version the `nsh` CLI on this machine reports (0.6.0). One entry per crate, so
# a bump is one edit and no member can resolve a different NSH.
[workspace.dependencies]
nsh-core = "=0.6.0"
nsh-base = "=0.6.0"
nsh-engine = { version = "=0.6.0", default-features = false }
nsh-testing = { version = "=0.6.0", default-features = false }
nsh-platform-macos = "=0.6.0"
nsh-platform-linux = "=0.6.0"
