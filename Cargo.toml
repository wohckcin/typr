[workspace]
resolver = "3"
members = ["crates/typr-core", "crates/typr"]

# Native Shell, at the version the `nsh` CLI on this machine reports (0.7.0). One entry per crate, so
# a bump is one edit and no member can resolve a different NSH.
[workspace.dependencies]
nsh-core = "=0.7.1"
nsh-base = "=0.7.1"
nsh-engine = { version = "=0.7.1", default-features = false }
nsh-testing = { version = "=0.7.1", default-features = false }
nsh-platform-macos = "=0.7.1"
nsh-platform-linux = "=0.7.1"

[workspace.lints.clippy]
map_err_ignore = "warn"
let_underscore_must_use = "warn"
