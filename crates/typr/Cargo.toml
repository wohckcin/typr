[package]
name = "typr"
version = "0.1.0"
edition = "2024"

default-run = "typr_nsh"

[dependencies]
typr-core = { path = "../typr-core" }
nsh-core.workspace = true
nsh-base.workspace = true
log = "0.4"
thiserror = "2"
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true
tempfile = "3.27.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[lints]
workspace = true
