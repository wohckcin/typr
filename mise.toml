# The tools this app builds and tests with. Keep the Rust pin and its components in step with
# rust-toolchain.toml: that file serves a plain `cargo` on a machine without mise, and this one is
# what CI installs.
[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy,rust-analyzer" }
"github:longbridge/nsh" = "0.7.1"

[env]
CLAUDE_CODE_EXPERIMENTAL_CODE_MODE = "1"
GH_TOKEN = "{{ exec(command='gh auth token --user wohckcin') }}"
