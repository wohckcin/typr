name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Rune draws through wgpu, so the runner needs Vulkan and the X11/wayland client libraries
    # even for headless snapshots: the tooling path still creates a surface for the frames it
    # renders. Development packages build and link, runtime packages load when a window opens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rune's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libxkbcommon-x11-0 mesa-vulkan-drivers

      # rust-toolchain.toml pins the channel, so rustup installs 1.99.1 without being told.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # A screen that writes .px(24.0) has left the visual language: every dimension is a token.
      - name: Refuse a dimension literal in a screen
        run: bash scripts/check-tokens.sh

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::cast_possible_truncation

      # The backend is the half that must not drag a graphics stack behind it.
      - name: Check the backend stays toolkit free
        run: |
          set -euo pipefail
          graph=$(cargo tree -p typr-core --edges normal)
          if echo "$graph" | grep -Eq '(^|[^a-z-])(rune|rune-kit|rune-extras|wgpu|wgpu-hal|winit|parley|parley_engine|accesskit)( |$)'; then
            echo "typr-core depends on a desktop toolkit:" >&2
            echo "$graph" | grep -E 'rune|wgpu|winit|parley|accesskit' >&2
            exit 1
          fi
          # The backend reports failures through events; writing them down belongs to the app.
          if echo "$graph" | grep -Eq '(^|[^a-z-])(log|env_logger|tracing)( |$)'; then
            echo "typr-core depends on a logging crate:" >&2
            echo "$graph" | grep -E '(^|[^a-z-])(log|env_logger|tracing)( |$)' >&2
            exit 1
          fi

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Snapshot every scene
        run: |
          set -euo pipefail
          export RUNE_DIRS_ROOT="$RUNNER_TEMP/typr-dirs"
          mkdir -p "$RUNNER_TEMP/snaps"
          for scene in $(cargo run -q -p typr -- --list-scenes); do
            cargo run -q -p typr -- --scene "$scene" --snap "$RUNNER_TEMP/snaps/$scene.png"
            test -s "$RUNNER_TEMP/snaps/$scene.png"
          done
