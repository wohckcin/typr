name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only a pull request's own newer run replaces it: a push answers a commit, and cancelling it would
# throw away the answer for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs read the repository; the app job also uploads one artifact. Anything wider is a
# credential a step could spend.
permissions:
  contents: read

env:
  # Logs are read in a terminal with colour.
  CARGO_TERM_COLOR: always
  # A cached target is only correct if nothing in it is incremental, and a debug build's symbols are
  # most of its bytes: neither is wanted on a runner.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback: the checks read sources and compile the whole workspace, which on Linux builds
  # nsh-platform-linux, so it needs GTK and GStreamer's dev packages exactly as the app job does.
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit, not a tag: a tag is a moving pointer its owner can repoint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native Shell's Linux host is GTK 4 (14 or newer) for its views and GStreamer for its media:
      # building the workspace links both, cache or no cache.
      - name: Install GTK and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          pkg-config --modversion gtk4 gstreamer-1.0

      # rust-toolchain.toml pins the channel, so rustup installs 1.99.1 without being told.
      - name: Install the pinned toolchain
        run: rustup show

      # The registry and the workspace's own artifacts, pruned to what a fresh build needs: the
      # action drops incremental state, old dependency builds and the app's own stale output. Only
      # `main` writes a cache, so a branch restores main's and adds no entries of its own.
      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A key of its own: two jobs saving one entry race, and the winner would seed the loser
          # with a build it never made.
          shared-key: linux-checks
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      # A screen that writes .px(24.0) has left the visual language: every dimension is a token.
      - name: Refuse a dimension literal in a screen
        run: bash scripts/check-tokens.sh

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::cast_possible_truncation

      # The backend is the half that must not drag a graphics stack behind it.
      - name: Check the backend stays toolkit free
        run: |
          set -euo pipefail
          graph=$(cargo tree -p typr-core --edges normal)
          if echo "$graph" | grep -Eq '(^|[^a-z-])(nsh-core|nsh-base|nsh-engine|nsh-testing|nsh-platform)( |$)'; then
            echo "typr-core depends on Native Shell:" >&2
            echo "$graph" | grep -E 'nsh-' >&2
            exit 1
          fi
          # The backend reports failures through events; writing them down belongs to the app.
          if echo "$graph" | grep -Eq '(^|[^a-z-])(log|env_logger|tracing)( |$)'; then
            echo "typr-core depends on a logging crate:" >&2
            echo "$graph" | grep -E '(^|[^a-z-])(log|env_logger|tracing)( |$)' >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

  # The app driven through the CLI on the Linux host. Separate so it runs beside `checks`: the
  # Linux host's GTK and GStreamer packages and its build are the slow part, and nothing in
  # `checks` waits on them.
  app:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native Shell's Linux host is GTK 4 (14 or newer) for its views and GStreamer for its media.
      # The dev packages are what pkg-config and the linker need to build the host.
      - name: Install GTK and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          pkg-config --modversion gtk4 gstreamer-1.0

      - name: Install the pinned toolchain
        run: rustup show

      # A cache of its own: this job builds the Linux development host as well as the crate.
      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-app
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # nsh.dev's script installs a release whole (its runtimes live beside bin/nsh) and links it
      # into ~/.local/bin; ~/.nsh is ~70 MB and changes only when the pin does.
      - name: Cache the Native Shell CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-v0.5.1

      - name: Install the Native Shell CLI
        run: |
          set -euo pipefail
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.5.1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nsh" --version

      # `desktop.test.tsx` opens the app and reads its screens; headless it needs no display.
      - name: Test the app through the CLI
        run: nsh test --junit test-results.xml

      # The one artifact the workflow uploads, whatever the tests said, so a red run can be read.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn
