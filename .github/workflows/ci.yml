name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only a pull request's own newer run replaces it. A dispatch is recording a set and a push is
# answering a commit; cancelling either throws away work the other run will not redo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job reads the repository and uploads one artifact. Anything wider is a credential a step
# could spend.
permissions:
  contents: read

env:
  # Logs are read in a terminal with colour, and a cached target is only correct if nothing in it is
  # incremental.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  test:
    # The label selects the Ubuntu 26 image family, not one build of it. Measured so far, the pool serves
    # two builds (20261111.196.1 and 20261111.82.6), and both drew the committed pictures byte for byte.
    # A build that changes the pictures fails Compare; re-record from a dispatch run.
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      # Actions are pinned to a commit, not a tag: a tag is a moving pointer its owner can repoint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native Shell's Linux host is GTK 4 (14 or newer) and needs a display to draw: xvfb gives
      # one, and the dev packages build and link the host.
      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb
          pkg-config --modversion gtk4

      # rust-toolchain.toml pins the channel, so rustup installs 1.99.1 without being told.
      - name: Install the pinned toolchain
        run: rustup show

      # The registry, the git checkouts of the pinned crates and the build itself. The key carries the
      # lockfile and the toolchain channel, so a dependency bump or a compiler bump misses this cache
      # rather than restoring objects the current build cannot use.
      - name: Cache the registry and the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      # A screen that writes .px(24.0) has left the visual language: every dimension is a token.
      - name: Refuse a dimension literal in a screen
        run: bash scripts/check-tokens.sh

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::cast_possible_truncation

      # The backend is the half that must not drag a graphics stack behind it.
      - name: Check the backend stays toolkit free
        run: |
          set -euo pipefail
          graph=$(cargo tree -p typr-core --edges normal)
          if echo "$graph" | grep -Eq '(^|[^a-z-])(nsh-core|nsh-base|nsh-engine|nsh-testing|nsh-platform)( |$)'; then
            echo "typr-core depends on Native Shell:" >&2
            echo "$graph" | grep -E 'nsh-' >&2
            exit 1
          fi
          # The backend reports failures through events; writing them down belongs to the app.
          if echo "$graph" | grep -Eq '(^|[^a-z-])(log|env_logger|tracing)( |$)'; then
            echo "typr-core depends on a logging crate:" >&2
            echo "$graph" | grep -E '(^|[^a-z-])(log|env_logger|tracing)( |$)' >&2
            exit 1
          fi

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # The screens draw on the GTK host, which needs a display: xvfb supplies one.
      - name: Test the screens on the Linux host
        run: xvfb-run -a nsh test --target linux

